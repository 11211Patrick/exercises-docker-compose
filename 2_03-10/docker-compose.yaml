services:
  frontend:
    build:
      context: ../example-app/frontend
      dockerfile: Dockerfile.frontend
  backend:
    build:
      context: ../example-app/backend
      dockerfile: Dockerfile.backend
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: example
    depends_on:
      - redis
      - db
    restart: unless-stopped
  redis:
    image: redis

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - ./database:/var/lib/postgresql
    container_name: db_redmine


  nginx:
    image: nginx
    ports:
    - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
