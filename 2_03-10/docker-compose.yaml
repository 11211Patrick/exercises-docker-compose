services:
  frontend:
    build:
      context: ../example-app/frontend
      dockerfile: Dockerfile.frontend
    ports:
      - 5001:5001
  backend:
    build:
      context: ../example-app/backend
      dockerfile: Dockerfile.backend
    ports:
      - 8080:8080
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis
