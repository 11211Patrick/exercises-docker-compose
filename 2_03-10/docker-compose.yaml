services:
  frontend:
    build:
      context: ../example-app/frontend
      dockerfile: Dockerfile.frontend
    ports:
      - 5001:5001
  backend:
    build:
      context: ../example-app/backend
      dockerfile: Dockerfile.backend
    ports:
      - 8080:8080
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: example
    depends_on:
      - redis
      - db
    restart: unless-stopped
  redis:
    image: redis

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    container_name: db_redmine
